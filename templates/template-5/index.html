<script>
(function(){
  // Frame-buster redirect (Prevent direct standalone scraping)
  if (window.top === window.self) {
    var p = window.location.pathname;
    var seg = p.split('/').filter(Boolean);
    var tName = seg.length > 1 ? seg[seg.length - 2] : '';
    window.location.replace('/' + (tName ? '?preview=' + encodeURIComponent(tName) : ''));
  }
  // Disable context menu
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; }, {capture:true});
  // Disable DevTools shortcuts
  document.addEventListener('keydown', function(e){
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.key === 'i' || e.key === 'j' || e.key === 'c')) || (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'U' || e.key === 'S'))) {
      e.preventDefault();
      return false;
    }
  }, {capture:true});
  // Anti-debugging loop
  setInterval(function(){ try { (function(){}).constructor("debugger")(); } catch(e){} }, 1200);
})();
</script>
